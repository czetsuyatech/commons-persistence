logging:
  level:
    root: info
    com.czetsuyatech: debug

spring:
  # Datasource Configuration
  datasource:
    url: jdbc:h2:mem:commonspersistence
    driver-class-name: org.h2.Driver
    username: commonspersistence
    password: commonspersistence

  jpa:
    properties:
      hibernate:
        connection:
          url: jdbc:h2:mem:commonspersistence;DB_CLOSE_DELAY=-1
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
